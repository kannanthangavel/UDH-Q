<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/uploads/logos/udhayam_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UD-QM | Udhayam Agencies Quotation Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F5F8F5] text-slate-900 antialiased font-sans min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F5F8F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0F172A; padding: 20px; box-sizing: border-box;">
        <div style="background: white; border-radius: 20px; padding: 36px 32px; box-shadow: 0 10px 25px -5px rgba(0, 59, 64, 0.08), 0 8px 10px -6px rgba(0, 59, 64, 0.04); border: 1px solid #E2E8F0; text-align: center; max-width: 400px; width: 100%;">
          <div style="width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 16px; background: #00545C; display: flex; align-items: center; justify-content: center; color: #7DBA00; font-weight: 900; font-size: 22px; box-shadow: 0 4px 12px rgba(0, 84, 92, 0.25);">
            UD
          </div>
          <h2 style="margin: 0 0 6px; font-size: 19px; font-weight: 800; color: #00545C; letter-spacing: -0.02em;">UDHAYAM AGENCIES</h2>
          <p style="margin: 0 0 24px; font-size: 12px; color: #64748B; font-weight: 600;">Paint Division • Quotation Management</p>
          <div style="display: inline-block; width: 30px; height: 30px; border: 3px solid #E2E8F0; border-top-color: #00545C; border-radius: 50%; animation: udqm-spin 0.8s linear infinite;"></div>
          <p id="udqm-boot-text" style="margin: 18px 0 0; font-size: 11px; color: #64748B; font-weight: 600;">Connecting workspace...</p>
        </div>
      </div>
      <style>
        @keyframes udqm-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script>
      (function() {
        var timer = setTimeout(function() {
          var el = document.getElementById('udqm-boot-text');
          if (el) {
            el.innerHTML = '<span style="color:#00545C;">Waking cloud server (~15s)...</span>';
          }
        }, 3500);
        window.addEventListener('error', function(e) {
          clearTimeout(timer);
          var el = document.getElementById('udqm-boot-text');
          if (el) {
            el.innerHTML = '<span style="color:#DC2626;font-weight:700;">Connection interrupted.</span><br><button onclick="location.reload()" style="margin-top:12px;padding:8px 18px;background:#00545C;color:white;border:none;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.15);">Reload UD-QM</button>';
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
